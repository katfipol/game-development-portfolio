<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">Progresión de niveles de EduMundo</title>
  <desc id="desc">Las diez preguntas avanzan por los biomas Pradera, Desierto, Nieve y Atardecer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c55"/><stop offset="1" stop-color="#1e3b72"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ade80"/><stop offset=".36" stop-color="#fbbf24"/><stop offset=".68" stop-color="#bae6fd"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#081426" flood-opacity=".7"/></filter>
  </defs>
  <rect width="1400" height="340" rx="26" fill="url(#bg)"/>
  <text x="700" y="42" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="800" letter-spacing="2">RUTA DE DIFICULTAD</text>
  <text x="700" y="70" text-anchor="middle" fill="#bfd0e5" font-family="Segoe UI,Arial" font-size="14">Las operaciones, el movimiento y la precisión evolucionan a lo largo de diez desafíos.</text>
  <path d="M160 170H1240" stroke="#081426" stroke-width="20" stroke-linecap="round"/>
  <path d="M160 170H1240" stroke="url(#route)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Segoe UI,Arial" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(180 170)"><circle r="52" fill="#173f2c" stroke="#4ade80" stroke-width="5"/><path d="M-30 16Q0-27 30 16Z" fill="#4ade80"/><circle cx="22" cy="-23" r="10" fill="#fde68a"/><text y="82" fill="#86efac" font-size="18" font-weight="800">PRADERA</text><text y="104" fill="#d7e4ef" font-size="13">Preguntas 1–3</text></g>
    <g transform="translate(525 170)"><circle r="52" fill="#513717" stroke="#fbbf24" stroke-width="5"/><path d="M-33 18L-12-17 7 18 25-9 38 18Z" fill="#f59e0b"/><circle cx="24" cy="-25" r="12" fill="#fde047"/><text y="82" fill="#fde68a" font-size="18" font-weight="800">DESIERTO</text><text y="104" fill="#d7e4ef" font-size="13">Preguntas 4–6</text></g>
    <g transform="translate(875 170)"><circle r="52" fill="#234358" stroke="#bae6fd" stroke-width="5"/><path d="M-36 20L-8-25 8 0 22-20 39 20Z" fill="#e0f2fe"/><path d="M-8-25L0-12 8 0-2-2Z" fill="#7dd3fc"/><text y="82" fill="#dff6ff" font-size="18" font-weight="800">NIEVE</text><text y="104" fill="#d7e4ef" font-size="13">Preguntas 7–8</text></g>
    <g transform="translate(1220 170)"><circle r="52" fill="#503052" stroke="#f472b6" stroke-width="5"/><circle cx="19" cy="-22" r="14" fill="#fbbf24"/><path d="M-38 20L-13-15 7 20 23-4 39 20Z" fill="#8b5cf6"/><text y="82" fill="#f9a8d4" font-size="18" font-weight="800">ATARDECER</text><text y="104" fill="#d7e4ef" font-size="13">Preguntas 9–10</text></g>
  </g>
  <path d="M390 301H1010" stroke="url(#route)" stroke-width="2" opacity=".7"/>
  <text x="700" y="325" text-anchor="middle" fill="#a9bfd5" font-family="Segoe UI,Arial" font-size="12" letter-spacing="1.2">OPERACIONES MÁS COMPLEJAS · BLOQUES MÁS PEQUEÑOS · MOVIMIENTO CONTROLADO</text>
</svg>
