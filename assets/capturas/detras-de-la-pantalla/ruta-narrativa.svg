<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Ruta narrativa de Detrás de la pantalla</title>
  <desc id="desc">Diagrama desde el anonimato digital hasta los finales de cambio o aislamiento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7667ff"/><stop offset="1" stop-color="#b3a8ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7f8ca8"/></marker>
  </defs>
  <rect width="1440" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="86" cy="82" r="4" fill="#a99cff" opacity=".75"/><circle cx="1340" cy="110" r="6" fill="#75e6a0" opacity=".55"/><circle cx="1320" cy="530" r="4" fill="#ef8899" opacity=".55"/>
  <text x="72" y="78" fill="#b7aaff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="3">MAPA DE DECISIONES</text>
  <text x="72" y="126" fill="#f7f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="36" font-weight="800">Del anonimato a la responsabilidad</text>
  <text x="72" y="160" fill="#9da9bc" font-family="Inter,Segoe UI,sans-serif" font-size="19">Las elecciones cambian los vínculos, no solo el marcador.</text>
  <path d="M325 315H418" stroke="#7f8ca8" stroke-width="4" marker-end="url(#arrow)"/><path d="M712 315H798" stroke="#7f8ca8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1060 294C1118 294 1115 232 1168 232" fill="none" stroke="#75e6a0" stroke-width="4" marker-end="url(#arrow)"/><path d="M1060 336C1118 336 1115 438 1168 438" fill="none" stroke="#ef8899" stroke-width="4" marker-end="url(#arrow)"/>
  <g><rect x="70" y="234" width="255" height="162" rx="24" fill="#111a2b" stroke="#52617b" stroke-width="2"/><circle cx="112" cy="278" r="20" fill="#7667ff"/><path d="M104 270h16v18h-16zm3-5h10v5h-10z" fill="#fff"/><text x="145" y="282" fill="#f7f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="800">Cuenta anónima</text><text x="102" y="328" fill="#b4bfd0" font-family="Inter,Segoe UI,sans-serif" font-size="17">Publicar o no participar</text><text x="102" y="357" fill="#8e9ab0" font-family="Inter,Segoe UI,sans-serif" font-size="15">La pantalla crea una falsa distancia.</text></g>
  <g><rect x="420" y="234" width="292" height="162" rx="24" fill="#111a2b" stroke="#52617b" stroke-width="2"/><circle cx="462" cy="278" r="20" fill="#49c7e8"/><path d="M452 271h20v15h-20zm4-6h12v6h-12z" fill="#fff"/><text x="495" y="282" fill="#f7f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="800">La verdad aparece</text><text x="452" y="328" fill="#b4bfd0" font-family="Inter,Segoe UI,sans-serif" font-size="17">Casillero vacío y mensajes</text><text x="452" y="357" fill="#8e9ab0" font-family="Inter,Segoe UI,sans-serif" font-size="15">Lo digital alcanza el espacio escolar.</text></g>
  <g><rect x="800" y="224" width="260" height="182" rx="26" fill="#17182f" stroke="url(#violet)" stroke-width="3"/><text x="930" y="268" text-anchor="middle" fill="#b9adff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="2">DECISIÓN CENTRAL</text><text x="930" y="313" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">¿Qué hará Masteo?</text><text x="930" y="353" text-anchor="middle" fill="#75e6a0" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Cerrar, reconocer y actuar</text><text x="930" y="383" text-anchor="middle" fill="#ef8899" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Ocultar o minimizar</text></g>
  <g><rect x="1170" y="170" width="210" height="126" rx="22" fill="#0d2a20" stroke="#3ecf78" stroke-width="2"/><text x="1275" y="213" text-anchor="middle" fill="#75e6a0" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">FINAL DE CAMBIO</text><text x="1275" y="251" text-anchor="middle" fill="#f2fff6" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="800">La confianza vuelve</text><text x="1275" y="277" text-anchor="middle" fill="#9ed9b4" font-family="Inter,Segoe UI,sans-serif" font-size="14">mediante acciones</text></g>
  <g><rect x="1170" y="376" width="210" height="126" rx="22" fill="#301820" stroke="#e76379" stroke-width="2"/><text x="1275" y="419" text-anchor="middle" fill="#ef8899" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">FINAL DE AISLAMIENTO</text><text x="1275" y="457" text-anchor="middle" fill="#fff4f6" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="800">Detrás de la pantalla</text><text x="1275" y="483" text-anchor="middle" fill="#d6a1aa" font-family="Inter,Segoe UI,sans-serif" font-size="14">los vínculos se alejan</text></g>
  <rect x="70" y="522" width="990" height="56" rx="16" fill="#0e1625" stroke="#2b3950"/><text x="98" y="557" fill="#9da9bc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Indicadores:</text><text x="210" y="557" fill="#b9adff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Control</text><text x="300" y="557" fill="#49c7e8" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Confianza</text><text x="408" y="557" fill="#75e6a0" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Responsabilidad</text><text x="585" y="557" fill="#9da9bc" font-family="Inter,Segoe UI,sans-serif" font-size="16">+ decisiones persistentes durante 12 escenas</text>
</svg>
