<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Modelo MDA y ciclo de energía de NutriFest</title>
  <desc id="desc">Tres tarjetas explican mecánica, dinámica y estética; una ruta inferior muestra cómo la energía conduce al portal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d29"/>
      <stop offset="1" stop-color="#0a1d20"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6f42a"/>
      <stop offset="1" stop-color="#55c85e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca73"/>
      <stop offset="1" stop-color="#ff7b62"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78e6e1"/>
      <stop offset="1" stop-color="#3e9fc6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="30" fill="url(#bg)"/>
  <circle cx="96" cy="60" r="75" fill="#70db75" opacity=".08"/>
  <circle cx="1110" cy="365" r="115" fill="#56c7d5" opacity=".07"/>
  <path d="M0 376 C190 318 305 422 485 367 C682 307 790 413 974 359 C1065 332 1137 338 1200 315 V440 H0Z" fill="#1d5143" opacity=".38"/>

  <text x="600" y="48" text-anchor="middle" fill="#b6f42a" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1">DEL DISEÑO A LA EXPERIENCIA</text>
  <text x="600" y="76" text-anchor="middle" fill="#cbe7df" font-family="Arial, sans-serif" font-size="15">El marco MDA aplicado al ciclo jugable de NutriFest</text>

  <g transform="translate(62 102)" filter="url(#shadow)">
    <rect width="325" height="176" rx="24" fill="#f7fff9"/>
    <rect width="325" height="12" rx="6" fill="url(#green)"/>
    <circle cx="47" cy="53" r="25" fill="#dff7b5"/>
    <path d="M40 40 v25 M33 52 h14" stroke="#397d42" stroke-width="6" stroke-linecap="round"/>
    <text x="84" y="48" fill="#173b31" font-family="Arial, sans-serif" font-size="22" font-weight="900">MECÁNICA</text>
    <text x="84" y="70" fill="#5e746d" font-family="Arial, sans-serif" font-size="12" font-weight="700">LAS REGLAS Y ACCIONES</text>
    <text x="28" y="108" fill="#29483f" font-family="Arial, sans-serif" font-size="15">Avance automático, salto, colisiones,</text>
    <text x="28" y="131" fill="#29483f" font-family="Arial, sans-serif" font-size="15">energía, alimentos, obstáculos y portal.</text>
    <rect x="28" y="148" width="269" height="2" rx="1" fill="#d7ebe0"/>
    <text x="28" y="168" fill="#397d42" font-family="Arial, sans-serif" font-size="12" font-weight="700">QUÉ PUEDE HACER EL JUGADOR</text>
  </g>

  <path d="M400 190 h48" stroke="#b6f42a" stroke-width="5" stroke-linecap="round"/>
  <path d="M441 181 l14 9 -14 9" fill="none" stroke="#b6f42a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(438 102)" filter="url(#shadow)">
    <rect width="325" height="176" rx="24" fill="#fffaf5"/>
    <rect width="325" height="12" rx="6" fill="url(#orange)"/>
    <circle cx="47" cy="53" r="25" fill="#ffe4c4"/>
    <path d="M32 58 q15-26 30 0 M38 58 h18" fill="none" stroke="#b8543f" stroke-width="5" stroke-linecap="round"/>
    <text x="84" y="48" fill="#173b31" font-family="Arial, sans-serif" font-size="22" font-weight="900">DINÁMICA</text>
    <text x="84" y="70" fill="#765f57" font-family="Arial, sans-serif" font-size="12" font-weight="700">LAS DECISIONES EN PARTIDA</text>
    <text x="28" y="108" fill="#4c403b" font-family="Arial, sans-serif" font-size="15">Priorizar alimentos saludables, evitar</text>
    <text x="28" y="131" fill="#4c403b" font-family="Arial, sans-serif" font-size="15">la pesadez y llegar al portal con 100%.</text>
    <rect x="28" y="148" width="269" height="2" rx="1" fill="#f0dfd4"/>
    <text x="28" y="168" fill="#b8543f" font-family="Arial, sans-serif" font-size="12" font-weight="700">CÓMO SE COMPORTA EL JUGADOR</text>
  </g>

  <path d="M776 190 h48" stroke="#78e6e1" stroke-width="5" stroke-linecap="round"/>
  <path d="M817 181 l14 9 -14 9" fill="none" stroke="#78e6e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(814 102)" filter="url(#shadow)">
    <rect width="325" height="176" rx="24" fill="#f5fdff"/>
    <rect width="325" height="12" rx="6" fill="url(#cyan)"/>
    <circle cx="47" cy="53" r="25" fill="#d2f4f3"/>
    <path d="M33 48 q14 20 28 0 M36 43 h3 M55 43 h3" fill="none" stroke="#277d84" stroke-width="5" stroke-linecap="round"/>
    <text x="84" y="48" fill="#173b31" font-family="Arial, sans-serif" font-size="22" font-weight="900">ESTÉTICA</text>
    <text x="84" y="70" fill="#587277" font-family="Arial, sans-serif" font-size="12" font-weight="700">LA EXPERIENCIA RESULTANTE</text>
    <text x="28" y="108" fill="#304b50" font-family="Arial, sans-serif" font-size="15">Velocidad, tensión controlada y la</text>
    <text x="28" y="131" fill="#304b50" font-family="Arial, sans-serif" font-size="15">satisfacción de elegir y avanzar.</text>
    <rect x="28" y="148" width="269" height="2" rx="1" fill="#d5e9eb"/>
    <text x="28" y="168" fill="#277d84" font-family="Arial, sans-serif" font-size="12" font-weight="700">QUÉ SIENTE EL JUGADOR</text>
  </g>

  <g transform="translate(89 323)">
    <rect x="0" y="0" width="132" height="54" rx="27" fill="#f7fff9"/>
    <text x="66" y="22" text-anchor="middle" fill="#173b31" font-family="Arial, sans-serif" font-size="13" font-weight="800">INICIO</text>
    <text x="66" y="42" text-anchor="middle" fill="#569258" font-family="Arial, sans-serif" font-size="17" font-weight="900">50% energía</text>
    <path d="M147 27 h84" stroke="#80d86a" stroke-width="5" stroke-linecap="round"/>
    <path d="M224 18 l14 9 -14 9" fill="none" stroke="#80d86a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="246" y="0" width="170" height="54" rx="27" fill="#dcf8ba"/>
    <text x="331" y="23" text-anchor="middle" fill="#315e37" font-family="Arial, sans-serif" font-size="13" font-weight="800">COMIDA SALUDABLE</text>
    <text x="331" y="42" text-anchor="middle" fill="#397d42" font-family="Arial, sans-serif" font-size="15" font-weight="900">energía + combo</text>
    <path d="M431 27 h84" stroke="#b6f42a" stroke-width="5" stroke-linecap="round"/>
    <path d="M508 18 l14 9 -14 9" fill="none" stroke="#b6f42a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="530" y="0" width="142" height="54" rx="27" fill="#b6f42a"/>
    <text x="601" y="22" text-anchor="middle" fill="#173b31" font-family="Arial, sans-serif" font-size="13" font-weight="800">OBJETIVO</text>
    <text x="601" y="42" text-anchor="middle" fill="#173b31" font-family="Arial, sans-serif" font-size="17" font-weight="900">100% energía</text>
    <path d="M687 27 h84" stroke="#78e6e1" stroke-width="5" stroke-linecap="round"/>
    <path d="M764 18 l14 9 -14 9" fill="none" stroke="#78e6e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="786" y="0" width="132" height="54" rx="27" fill="#d2f4f3"/>
    <text x="852" y="22" text-anchor="middle" fill="#275f65" font-family="Arial, sans-serif" font-size="13" font-weight="800">PORTAL</text>
    <text x="852" y="42" text-anchor="middle" fill="#277d84" font-family="Arial, sans-serif" font-size="15" font-weight="900">siguiente nivel</text>
  </g>

  <rect x="400" y="394" width="400" height="28" rx="14" fill="#341f32" opacity=".92"/>
  <text x="600" y="413" text-anchor="middle" fill="#f3c6e8" font-family="Arial, sans-serif" font-size="13" font-weight="700">Comida chatarra u obstáculo → menos energía → 0%: reintentar nivel</text>
</svg>
