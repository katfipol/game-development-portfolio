<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de clasificación de EcoFest</title>
  <desc id="desc">Ruta visual con cuatro contenedores: plástico, papel, vidrio y orgánico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3028"/>
      <stop offset="1" stop-color="#155b3c"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe36a"/>
      <stop offset="1" stop-color="#e5a900"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b7ff"/>
      <stop offset="1" stop-color="#2f6fd1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77e898"/>
      <stop offset="1" stop-color="#209148"/>
    </linearGradient>
    <linearGradient id="organic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d39a63"/>
      <stop offset="1" stop-color="#79501f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#041a15" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 282 C160 225 270 326 425 271 C575 217 690 317 840 265 C992 213 1084 283 1200 235 V360 H0Z" fill="#1e7447" opacity=".55"/>
  <g fill="#fff" opacity=".08">
    <circle cx="95" cy="72" r="46"/><circle cx="1108" cy="86" r="64"/>
    <circle cx="591" cy="318" r="88"/><circle cx="850" cy="33" r="24"/>
  </g>

  <text x="600" y="48" text-anchor="middle" fill="#f7d46a" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="1">OBSERVA · CAMBIA · CLASIFICA</text>
  <text x="600" y="76" text-anchor="middle" fill="#d8f6e6" font-family="Arial, sans-serif" font-size="15">Cada residuo correcto suma puntos y mantiene la racha</text>

  <path d="M174 116 H1026" stroke="#9be7b9" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 13" opacity=".65"/>

  <g transform="translate(88 98)" filter="url(#shadow)">
    <rect width="220" height="188" rx="22" fill="#f6fff9"/>
    <rect x="18" y="18" width="184" height="14" rx="7" fill="#f0bb13"/>
    <path d="M59 66 H161 L151 143 Q149 158 134 158 H86 Q71 158 69 143Z" fill="url(#plastic)"/>
    <path d="M51 57 Q51 47 61 47 H159 Q169 47 169 57 V67 H51Z" fill="#c99400"/>
    <path d="M104 84 l13 22 h-10 l10 17 h-25 l12-18 h-9z" fill="#fff" opacity=".9"/>
    <text x="110" y="169" text-anchor="middle" fill="#17382f" font-family="Arial, sans-serif" font-size="18" font-weight="800">PLÁSTICO</text>
    <text x="110" y="187" text-anchor="middle" fill="#4b675e" font-family="Arial, sans-serif" font-size="11">botellas · envases · bolsas</text>
  </g>

  <g transform="translate(356 98)" filter="url(#shadow)">
    <rect width="220" height="188" rx="22" fill="#f6fff9"/>
    <rect x="18" y="18" width="184" height="14" rx="7" fill="#4d96ff"/>
    <path d="M59 66 H161 L151 143 Q149 158 134 158 H86 Q71 158 69 143Z" fill="url(#paper)"/>
    <path d="M51 57 Q51 47 61 47 H159 Q169 47 169 57 V67 H51Z" fill="#2f6fd1"/>
    <path d="M93 87 h34 v45 H93z M99 95 h22 M99 103 h22 M99 111 h17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="110" y="169" text-anchor="middle" fill="#17382f" font-family="Arial, sans-serif" font-size="18" font-weight="800">PAPEL</text>
    <text x="110" y="187" text-anchor="middle" fill="#4b675e" font-family="Arial, sans-serif" font-size="11">hojas · cartón · periódico</text>
  </g>

  <g transform="translate(624 98)" filter="url(#shadow)">
    <rect width="220" height="188" rx="22" fill="#f6fff9"/>
    <rect x="18" y="18" width="184" height="14" rx="7" fill="#3ecf6a"/>
    <path d="M59 66 H161 L151 143 Q149 158 134 158 H86 Q71 158 69 143Z" fill="url(#glass)"/>
    <path d="M51 57 Q51 47 61 47 H159 Q169 47 169 57 V67 H51Z" fill="#209148"/>
    <path d="M103 88 h14 v8 l7 8 v29 q0 8-8 8h-12q-8 0-8-8v-29l7-8z" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="110" y="169" text-anchor="middle" fill="#17382f" font-family="Arial, sans-serif" font-size="18" font-weight="800">VIDRIO</text>
    <text x="110" y="187" text-anchor="middle" fill="#4b675e" font-family="Arial, sans-serif" font-size="11">frascos · botellas · vasos</text>
  </g>

  <g transform="translate(892 98)" filter="url(#shadow)">
    <rect width="220" height="188" rx="22" fill="#f6fff9"/>
    <rect x="18" y="18" width="184" height="14" rx="7" fill="#a9713f"/>
    <path d="M59 66 H161 L151 143 Q149 158 134 158 H86 Q71 158 69 143Z" fill="url(#organic)"/>
    <path d="M51 57 Q51 47 61 47 H159 Q169 47 169 57 V67 H51Z" fill="#79501f"/>
    <path d="M112 88 c22 7 22 30 4 44 c-17 13-34-5-25-22 c7-14 23-7 32-22 c-2 20-15 29-29 33" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="110" y="169" text-anchor="middle" fill="#17382f" font-family="Arial, sans-serif" font-size="18" font-weight="800">ORGÁNICO</text>
    <text x="110" y="187" text-anchor="middle" fill="#4b675e" font-family="Arial, sans-serif" font-size="11">cáscaras · frutas · hojas</text>
  </g>

  <rect x="278" y="315" width="644" height="30" rx="15" fill="#08271f" opacity=".92"/>
  <text x="600" y="336" text-anchor="middle" fill="#d8f6e6" font-family="Arial, sans-serif" font-size="14" font-weight="700">La vida disminuye únicamente al atrapar un residuo con la categoría equivocada</text>
</svg>
