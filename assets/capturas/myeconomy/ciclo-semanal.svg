<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo semanal de MyEconomy</title>
  <desc id="desc">Diagrama del ciclo diario de ingresos, obligaciones, decisiones, balance y avance durante siete días.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061722"/><stop offset="1" stop-color="#17203a"/></linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36d58c"/><stop offset="1" stop-color="#7ce4b1"/></linearGradient>
    <linearGradient id="choice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ca4f94"/><stop offset="1" stop-color="#e580bc"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#68859a"/></marker>
  </defs>
  <rect width="1440" height="600" rx="34" fill="url(#bg)"/>
  <circle cx="1340" cy="75" r="5" fill="#e0ad32"/><circle cx="90" cy="520" r="4" fill="#cc5b9c"/><circle cx="1372" cy="520" r="4" fill="#45d99a"/>
  <text x="70" y="72" fill="#f0bf43" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="3">CICLO DE JUEGO</text>
  <text x="70" y="118" fill="#f7fbff" font-family="Inter,Segoe UI,sans-serif" font-size="36" font-weight="800">Una semana, decisiones que se acumulan</text>
  <text x="70" y="153" fill="#9db4c3" font-family="Inter,Segoe UI,sans-serif" font-size="19">Cada día exige cubrir lo necesario antes de decidir qué hacer con el resto.</text>

  <path d="M276 310H320" stroke="#68859a" stroke-width="4" marker-end="url(#arrow)"/><path d="M546 310H590" stroke="#68859a" stroke-width="4" marker-end="url(#arrow)"/><path d="M816 310H860" stroke="#68859a" stroke-width="4" marker-end="url(#arrow)"/><path d="M1086 310H1130" stroke="#68859a" stroke-width="4" marker-end="url(#arrow)"/>

  <g><rect x="50" y="222" width="226" height="176" rx="24" fill="#0c2735" stroke="#2d6276" stroke-width="2"/><circle cx="91" cy="264" r="21" fill="#267fa5"/><text x="91" y="271" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800">1</text><text x="122" y="270" fill="#eaf8ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">Ingresos</text><text x="80" y="318" fill="#a9c5d1" font-family="Inter,Segoe UI,sans-serif" font-size="16">Sueldo diario: Bs 80</text><text x="80" y="347" fill="#a9c5d1" font-family="Inter,Segoe UI,sans-serif" font-size="16">5 monedas de Bs 5</text><text x="80" y="376" fill="#6fcbe8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Solo un cobro por día</text></g>
  <g><rect x="320" y="222" width="226" height="176" rx="24" fill="#102b2b" stroke="#38b982" stroke-width="2"/><circle cx="361" cy="264" r="21" fill="url(#money)"/><text x="361" y="271" text-anchor="middle" fill="#052318" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800">2</text><text x="392" y="270" fill="#effff7" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">Obligaciones</text><text x="350" y="318" fill="#b6d7c6" font-family="Inter,Segoe UI,sans-serif" font-size="16">Vivienda y servicios</text><text x="350" y="347" fill="#b6d7c6" font-family="Inter,Segoe UI,sans-serif" font-size="16">Alimentación y transporte</text><text x="350" y="376" fill="#73e2ad" font-family="Inter,Segoe UI,sans-serif" font-size="14">Total diario: Bs 90</text></g>
  <g><rect x="590" y="222" width="226" height="176" rx="24" fill="#2b1830" stroke="#c35a98" stroke-width="2"/><circle cx="631" cy="264" r="21" fill="url(#choice)"/><text x="631" y="271" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800">3</text><text x="662" y="270" fill="#fff2fa" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">Decidir</text><text x="620" y="318" fill="#d7b8cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Ahorrar en el banco</text><text x="620" y="347" fill="#d7b8cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Comprar con criterio</text><text x="620" y="376" fill="#eb8bc2" font-family="Inter,Segoe UI,sans-serif" font-size="14">Necesidad, utilidad o deseo</text></g>
  <g><rect x="860" y="222" width="226" height="176" rx="24" fill="#2d2918" stroke="#c59a2d" stroke-width="2"/><circle cx="901" cy="264" r="21" fill="#e0ad32"/><text x="901" y="271" text-anchor="middle" fill="#261d04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800">4</text><text x="932" y="270" fill="#fff9e7" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">Balance</text><text x="890" y="318" fill="#d5cba9" font-family="Inter,Segoe UI,sans-serif" font-size="16">Dinero y ahorro</text><text x="890" y="347" fill="#d5cba9" font-family="Inter,Segoe UI,sans-serif" font-size="16">Salud, placer y estrés</text><text x="890" y="376" fill="#f0c95e" font-family="Inter,Segoe UI,sans-serif" font-size="14">El historial conserva decisiones</text></g>
  <g><rect x="1130" y="222" width="260" height="176" rx="24" fill="#161d32" stroke="#7c75d8" stroke-width="2"/><circle cx="1171" cy="264" r="21" fill="#8077e8"/><text x="1171" y="271" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800">5</text><text x="1202" y="270" fill="#f2f0ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">Avanzar</text><text x="1160" y="318" fill="#c5c1e5" font-family="Inter,Segoe UI,sans-serif" font-size="16">Días 1 al 7</text><text x="1160" y="347" fill="#c5c1e5" font-family="Inter,Segoe UI,sans-serif" font-size="16">Nuevas monedas y gastos</text><text x="1160" y="376" fill="#aaa4ff" font-family="Inter,Segoe UI,sans-serif" font-size="14">Día 7: evaluación final</text></g>

  <path d="M1260 412C1260 505 183 505 183 412" fill="none" stroke="#475e73" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <rect x="394" y="474" width="652" height="70" rx="18" fill="#081923" stroke="#355064"/>
  <text x="720" y="503" text-anchor="middle" fill="#9db4c3" font-family="Inter,Segoe UI,sans-serif" font-size="15">EVALUACIÓN DE LA SEMANA</text>
  <text x="720" y="531" text-anchor="middle" fill="#f6fbff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">35% ahorro · 35% salud financiera · 30% responsabilidad</text>
</svg>
