<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual de los seis videojuegos del portafolio</title>
  <desc id="desc">Seis mundos conectados representan matemáticas, reciclaje, nutrición, agua, convivencia digital y finanzas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081528"/><stop offset=".55" stop-color="#102a46"/><stop offset="1" stop-color="#171a35"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset=".2" stop-color="#22c55e"/><stop offset=".4" stop-color="#84cc16"/><stop offset=".6" stop-color="#38bdf8"/><stop offset=".8" stop-color="#818cf8"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity=".65"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd5ff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1400" height="390" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="390" rx="28" fill="url(#grid)"/>
  <circle cx="120" cy="55" r="90" fill="#f59e0b" opacity=".07"/><circle cx="1270" cy="330" r="130" fill="#38bdf8" opacity=".07"/>
  <text x="700" y="50" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="2">UN PORTAFOLIO · SEIS FORMAS DE APRENDER JUGANDO</text>
  <text x="700" y="78" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI,Arial,sans-serif" font-size="14">Cada mundo introduce una temática, una mecánica y una decisión de diseño diferente.</text>
  <path d="M115 215 C220 120 320 300 430 210 S640 115 750 210 S970 305 1080 210 S1240 125 1300 205" fill="none" stroke="#05101e" stroke-width="18" opacity=".8"/>
  <path d="M115 215 C220 120 320 300 430 210 S640 115 750 210 S970 305 1080 210 S1240 125 1300 205" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(48 115)" filter="url(#shadow)">
    <rect width="185" height="205" rx="22" fill="#15243a" stroke="#f59e0b" stroke-width="3"/>
    <rect x="14" y="14" width="157" height="82" rx="15" fill="#3b260d"/>
    <g transform="translate(49 28)"><rect width="40" height="40" rx="7" fill="#fbbf24"/><text x="20" y="28" text-anchor="middle" font-family="Arial" font-size="24" font-weight="900" fill="#5b3200">+</text><rect x="48" y="14" width="40" height="40" rx="7" fill="#fb923c"/><text x="68" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#5b2100">?</text></g>
    <text x="92.5" y="126" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial" font-size="19" font-weight="800">EDUMUNDO</text>
    <text x="92.5" y="151" text-anchor="middle" fill="#e5edf6" font-family="Segoe UI,Arial" font-size="13">Matemáticas</text><text x="92.5" y="173" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI,Arial" font-size="12">Plataformas</text>
    <rect x="49" y="187" width="87" height="4" rx="2" fill="#f59e0b"/>
  </g>

  <g transform="translate(272 115)" filter="url(#shadow)">
    <rect width="185" height="205" rx="22" fill="#132c2a" stroke="#22c55e" stroke-width="3"/>
    <rect x="14" y="14" width="157" height="82" rx="15" fill="#123a29"/>
    <g transform="translate(58 26)" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M35 3l17 22-10-2"/><path d="M57 28l-14 26-5-10"/><path d="M31 54H7l7-8"/><path d="M8 41L22 14l5 10"/></g>
    <text x="92.5" y="126" text-anchor="middle" fill="#4ade80" font-family="Segoe UI,Arial" font-size="19" font-weight="800">ECOFEST</text>
