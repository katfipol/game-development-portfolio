  <text x="700" y="357" text-anchor="middle" fill="#8ba5bd" font-family="Segoe UI,Arial" font-size="12" letter-spacing="1.6">MECÁNICAS · HISTORIAS · SISTEMAS · EXPERIENCIAS</text>
