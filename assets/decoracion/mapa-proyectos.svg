    <rect x="14" y="14" width="157" height="82" rx="15" fill="#263d15"/>
    <g transform="translate(57 21)"><path d="M35 17C15 5 1 24 6 48c5 23 18 35 29 24 11 11 25-1 30-24 5-24-9-43-30-31z" fill="#a3e635"/><path d="M35 18c2-12 10-18 19-20" fill="none" stroke="#65a30d" stroke-width="6"/><path d="M45 4c12-4 20 1 24 9-12 3-20-1-24-9" fill="#4ade80"/></g>
    <text x="92.5" y="126" text-anchor="middle" fill="#a3e635" font-family="Segoe UI,Arial" font-size="19" font-weight="800">NUTRIFEST</text>
    <text x="92.5" y="151" text-anchor="middle" fill="#e5edf6" font-family="Segoe UI,Arial" font-size="13">Alimentación</text><text x="92.5" y="173" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI,Arial" font-size="12">Auto-runner</text>
    <rect x="49" y="187" width="87" height="4" rx="2" fill="#84cc16"/>
  </g>

  <g transform="translate(720 115)" filter="url(#shadow)">
    <rect width="185" height="205" rx="22" fill="#102b42" stroke="#38bdf8" stroke-width="3"/>
    <rect x="14" y="14" width="157" height="82" rx="15" fill="#0c3a59"/>
    <path d="M93 20C76 43 59 60 59 74a34 34 0 0068 0c0-14-17-31-34-54z" fill="#38bdf8"/><path d="M79 78c3 9 10 14 21 15" fill="none" stroke="#d8f4ff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <text x="92.5" y="126" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="19" font-weight="800">WATERFEST</text>
    <text x="92.5" y="151" text-anchor="middle" fill="#e5edf6" font-family="Segoe UI,Arial" font-size="13">Cuidado del agua</text><text x="92.5" y="173" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI,Arial" font-size="12">Minijuegos</text>
    <rect x="49" y="187" width="87" height="4" rx="2" fill="#38bdf8"/>
  </g>

  <g transform="translate(944 115)" filter="url(#shadow)">
    <rect width="185" height="205" rx="22" fill="#202343" stroke="#818cf8" stroke-width="3"/>
    <rect x="14" y="14" width="157" height="82" rx="15" fill="#29245b"/>
    <g transform="translate(55 22)"><rect x="11" width="55" height="72" rx="10" fill="#111827" stroke="#a5b4fc" stroke-width="4"/><rect x="18" y="11" width="41" height="40" rx="5" fill="#312e81"/><path d="M24 22h28M24 31h19M24 40h24" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/><circle cx="38" cy="61" r="4" fill="#818cf8"/></g>
    <text x="92.5" y="123" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI,Arial" font-size="17" font-weight="800">DETRÁS DE LA</text><text x="92.5" y="143" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI,Arial" font-size="17" font-weight="800">PANTALLA</text>
    <text x="92.5" y="167" text-anchor="middle" fill="#e5edf6" font-family="Segoe UI,Arial" font-size="12">Narrativa y decisiones</text>
    <rect x="49" y="187" width="87" height="4" rx="2" fill="#818cf8"/>
  </g>

  <g transform="translate(1168 115)" filter="url(#shadow)">
    <rect width="185" height="205" rx="22" fill="#302a12" stroke="#facc15" stroke-width="3"/>
    <rect x="14" y="14" width="157" height="82" rx="15" fill="#44340d"/>
    <g transform="translate(52 23)"><circle cx="40" cy="36" r="34" fill="#facc15" stroke="#fef08a" stroke-width="5"/><circle cx="40" cy="36" r="24" fill="#d99a0b"/><text x="40" y="47" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#fff7c2">Bs</text></g>
    <text x="92.5" y="126" text-anchor="middle" fill="#fde047" font-family="Segoe UI,Arial" font-size="19" font-weight="800">MYECONOMY</text>
    <text x="92.5" y="151" text-anchor="middle" fill="#e5edf6" font-family="Segoe UI,Arial" font-size="13">Finanzas</text><text x="92.5" y="173" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI,Arial" font-size="12">Simulación</text>
    <rect x="49" y="187" width="87" height="4" rx="2" fill="#facc15"/>
